name: tracker_alarm
description: A private, on-device GPS destination alarm for Android.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  latlong2: ^0.10.1
  geolocator: ^14.1.1
  permission_handler: ^12.0.1
  shared_preferences: ^2.5.6
  go_router: ^18.0.2
  google_maps_flutter: ^2.19.0
  url_launcher: ^6.3.3
  flutter_map: ^8.3.2
  archive: ^4.3.0
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
