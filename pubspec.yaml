name: tracker_alarm
description: A private, on-device GPS destination alarm for Android.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  maplibre: ^0.3.6
  latlong2: ^0.10.1
  geolocator: ^14.1.1
  permission_handler: ^12.0.1
  shared_preferences: ^2.5.6
  go_router: ^18.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  maplibre_platform_interface: ^0.3.6

flutter:
  uses-material-design: true
